<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy.

      `connect-src` es solo 'self': los catálogos externos (Jikan, AniList, MangaDex) y
      los proveedores OAuth los consulta el **backend**, no el navegador. Los tres hosts
      que había aquí no los llamaba nadie, y el cuarto fijaba el dominio de Render, que
      habría roto la aplicación al cambiar de despliegue. Una CSP que permite orígenes
      que no se usan no protege de menos: describe mal el sistema, y quien la lea creerá
      que el navegador habla con sitios con los que no habla.

      `frame-ancestors` no funciona en un <meta>; va como cabecera en netlify.toml, junto
      al resto de cabeceras que el HTML no puede declarar.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'sha256-IYTexaBW2P/TU5+vvdhnoCk+pMTN/aTLipMzPptvHeo=';
        style-src 'self' 'unsafe-inline' fonts.googleapis.com;
        font-src 'self' fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self';
        base-uri 'self';
        form-action 'self'
      "
    />
    <!-- Headers de seguridad adicionales -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Gestiona y descubre tu anime, manga, manhwa y más contenido multimedia."
    />
    <title>TrackerMultimedia</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      El hash SHA-256 de la CSP se calcula sobre el texto EXACTO de este script.
      Reformatearlo lo invalida, y entonces el navegador lo bloquea en silencio: no
      falla nada a la vista, simplemente vuelve el destello. De ahí el prettier-ignore
      de abajo, que tiene que ir solo —Prettier solo reconoce la directiva si el
      comentario no lleva nada más— y el test de index-csp.test.ts, que comprueba que
      hash y contenido siguen cuadrando.
    -->
    <!-- prettier-ignore -->
    <script>
      // Se ejecuta antes de pintar nada. Sin esto, el tema lo aplicaba React en su
      // primer render y en modo oscuro se veía un destello claro en cada carga.
      // Mantener en paralelo con src/shared/hooks/useDarkMode.ts: misma clave y
      // mismos valores. Es duplicación consciente — no hay forma de importar el
      // hook aquí sin volver a introducir el destello que esto elimina.
      (function () {
        try {
          var stored = localStorage.getItem('tm-theme');
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          // Sin localStorage se pinta el tema claro y el hook ya ajustará.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

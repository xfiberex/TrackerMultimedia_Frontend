<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: previene inyección de scripts e inline code -->
    <!-- frame-ancestors solo es efectivo como HTTP header; configurarlo en el servidor -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'sha256-IYTexaBW2P/TU5+vvdhnoCk+pMTN/aTLipMzPptvHeo=';
        style-src 'self' 'unsafe-inline' fonts.googleapis.com;
        font-src 'self' fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' https://*.jikan.moe https://*.googleapis.com https://api.github.com https://trackermultimedia-backend.onrender.com;
        base-uri 'self';
        form-action 'self'
      "
    />
    <!-- Headers de seguridad adicionales -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Gestiona y descubre tu anime, manga, manhwa y más contenido multimedia." />
    <title>TrackerMultimedia</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Se ejecuta antes de pintar nada. Sin esto, el tema lo aplicaba React en su
      // primer render y en modo oscuro se veía un destello claro en cada carga.
      // Mantener en paralelo con src/shared/hooks/useDarkMode.ts: misma clave y
      // mismos valores. Es duplicación consciente — no hay forma de importar el
      // hook aquí sin volver a introducir el destello que esto elimina.
      (function () {
        try {
          var stored = localStorage.getItem('tm-theme');
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          // Sin localStorage se pinta el tema claro y el hook ya ajustará.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
